<text x="70" y="596" font-size="12" font-weight="400" fill="#444" text-anchor="start">Start with H0 only (NUM_SENSORS = 1). Halls on 3V3, never 5V. 5V and GND to the pogo test are added in step 4.</text>
<text x="980" y="106" font-size="17" font-weight="700" fill="#222" text-anchor="start">4  Pogo contacts (power)</text>
<rect x="980" y="120" width="580" height="500" rx="10" fill="#fff" fill-opacity="0.85" stroke="#ccc" stroke-width="1.5"/>
<polyline points="980,292 1130,292" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
