<text x="1004" y="530" font-size="12" font-weight="400" fill="#333" text-anchor="start">a. XIAO unplugged: beep each pin through (continuity).</text>
<text x="1004" y="548" font-size="12" font-weight="400" fill="#333" text-anchor="start">b. Flip one half 180°. Repels = self-keyed. Snaps = faces must key it.</text>
<text x="1004" y="566" font-size="12" font-weight="400" fill="#333" text-anchor="start">c. Plug in USB: read ≈5 V on the male pins; wiggle, watch for dropouts.</text>
<text x="1004" y="584" font-size="12" font-weight="400" fill="#333" text-anchor="start">d. Hold a connector 5 / 10 / 15 mm from H0 (plotter mode p):</text>
<text x="1004" y="602" font-size="12" font-weight="400" fill="#333" text-anchor="start">    that sets the min. pogo-to-code-sensor distance for the face.</text>
<text x="40" y="660" font-size="17" font-weight="700" fill="#222" text-anchor="start">2  Signal vs gap (side view)</text>
