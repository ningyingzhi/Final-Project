<text x="84" y="724" font-size="12" font-weight="700" fill="#333" text-anchor="start">Serial Monitor (115200):</text>
<text x="84" y="746" font-size="12" font-weight="400" fill="#0f766e" text-anchor="start">Calibrated, baseline mV: 1652</text>
<text x="84" y="766" font-size="12" font-weight="400" fill="#0f766e" text-anchor="start">H0 +412 mV S (peak 430)   ID 2</text>
<text x="84" y="792" font-size="12" font-weight="400" fill="#555" text-anchor="start">r = reset peak, + / − = threshold, p = plotter</text>
<text x="64" y="850" font-size="12" font-weight="400" fill="#333" text-anchor="start">Mark the magnet face that reads S.</text>
<text x="64" y="868" font-size="12" font-weight="400" fill="#333" text-anchor="start">Real gap = 2 face walls + air (aim 2–3 mm).</text>
<text x="64" y="886" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Pass: |peak| ≥ 3 × threshold (80 mV) at that gap.</text>
<rect x="64" y="1050" width="14" height="10" fill="#dc2626"/>
