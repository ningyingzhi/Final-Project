<text x="1128" y="916.0" font-size="12" font-weight="600" fill="#444" text-anchor="start">gap</text>
<rect x="684" y="940" width="52" height="26" rx="3" fill="#333" stroke="#111" stroke-width="1.5"/>
<text x="710" y="958" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">H0</text>
<rect x="834" y="940" width="52" height="26" rx="3" fill="#333" stroke="#111" stroke-width="1.5"/>
<text x="860" y="958" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">H1</text>
<rect x="984" y="940" width="52" height="26" rx="3" fill="#333" stroke="#111" stroke-width="1.5"/>
<text x="1010" y="958" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">H2</text>
<line x1="710" y1="1000" x2="860" y2="1000" stroke="#444" stroke-width="1.2" marker-start="url(#dims)" marker-end="url(#dim)"/>
<text x="785.0" y="994" font-size="12" font-weight="600" fill="#444" text-anchor="middle">spacing: try 10 / 15 / 20 mm</text>
<text x="590" y="1046" font-size="15" font-weight="700" fill="#0f766e" text-anchor="start">Reads:  H0 S   H1 –   H2 N   →   ID = 2 + 3·0 + 9·1 = 11</text>
<text x="590" y="1070" font-size="12" font-weight="400" fill="#555" text-anchor="start">(none = 0, N = 1, S = 2; ID 0 = nothing above)</text>
<text x="590" y="1100" font-size="12" font-weight="400" fill="#333" text-anchor="start">Crosstalk: one magnet over H0 only. H1, H2 must stay "–".</text>
<text x="590" y="1118" font-size="12" font-weight="700" fill="#16a34a" text-anchor="start">Smallest spacing that stays clean = code-spot pitch for the face.</text>
<rect x="1200" y="680" width="360" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1220" y="712" font-size="15" font-weight="700" fill="#6b7280" text-anchor="start">Not used in this test</text>
<text x="1220" y="738" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Core breadboard (Teensy 4.1 + audio</text>
<text x="1220" y="756" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">shield, sketch 02) stays untouched.</text>
<text x="1220" y="786" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Later (P5), this XIAO talks to the</text>
<text x="1220" y="804" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Core over ESP-NOW, not wires.</text>
<rect x="1200" y="860" width="360" height="240" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="1220" y="892" font-size="15" font-weight="700" fill="#222" text-anchor="start">Results → C1 face standard</text>
<text x="1220" y="926" font-size="13" font-weight="400" fill="#333" text-anchor="start">□  gap at code spots: ___ mm</text>
<text x="1220" y="956" font-size="13" font-weight="400" fill="#333" text-anchor="start">□  threshold on / off: ___ / ___ mV</text>
<text x="1220" y="986" font-size="13" font-weight="400" fill="#333" text-anchor="start">□  code-spot spacing: ___ mm</text>
<text x="1220" y="1016" font-size="13" font-weight="400" fill="#333" text-anchor="start">□  pogo ↔ sensor min: ___ mm</text>
<text x="1220" y="1046" font-size="13" font-weight="400" fill="#333" text-anchor="start">□  pogo self-keyed: yes / no</text>
