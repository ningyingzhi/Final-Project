<text x="1380.0" y="260" font-size="12" font-weight="700" fill="#333" text-anchor="middle">magnet card = "a block sits on top" (ID 11)</text>
<path d="M1530,300 l0,70" stroke="#555" stroke-width="2" marker-end="url(#ap)"/>
<text x="1536" y="340" font-size="11" font-weight="400" fill="#555" text-anchor="start">place /</text>
<text x="1536" y="354" font-size="11" font-weight="400" fill="#555" text-anchor="start">lift</text>
<polyline points="1150,422 1250,422 1250,710 230,710 230,260 270,260" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 6" marker-end="url(#ap)"/>
<text x="800.0" y="700" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">data jumper: XIAO D6 (TX) → Teensy pin 0 (RX1), 115200 baud, "ID,11,..." every 50 ms   (ESP-NOW replaces this wire in P5)</text>
<rect x="40" y="750" width="740" height="260" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="60" y="782" font-size="16" font-weight="700" fill="#222" text-anchor="start">What should happen (Teensy Serial Monitor)</text>
<text x="60" y="814" font-size="13" font-weight="700" fill="#333" text-anchor="start">switch on, card lifted (ID 0)</text>
<text x="300" y="814" font-size="13" font-weight="400" fill="#333" text-anchor="start">silent</text>
<text x="300" y="830" font-size="12" font-weight="400" fill="#0f766e" text-anchor="start">above Core: nothing</text>
<text x="60" y="852" font-size="13" font-weight="700" fill="#333" text-anchor="start">place card S / none / N</text>
<text x="300" y="852" font-size="13" font-weight="400" fill="#333" text-anchor="start">fades in on triangle ((11 − 1) % 3 = 1)</text>
<text x="300" y="868" font-size="12" font-weight="400" fill="#0f766e" text-anchor="start">above Core: block ID 11</text>
<text x="60" y="890" font-size="13" font-weight="700" fill="#333" text-anchor="start">change the card pattern</text>
<text x="300" y="890" font-size="13" font-weight="400" fill="#333" text-anchor="start">waveform follows the ID</text>
<text x="300" y="906" font-size="12" font-weight="400" fill="#0f766e" text-anchor="start">above Core: block ID …</text>
<text x="60" y="928" font-size="13" font-weight="700" fill="#333" text-anchor="start">pull the pogo pair apart</text>
<text x="300" y="928" font-size="13" font-weight="400" fill="#333" text-anchor="start">fades out within ~200 ms</text>
<text x="300" y="944" font-size="12" font-weight="400" fill="#0f766e" text-anchor="start">link: lost</text>
<text x="60" y="966" font-size="13" font-weight="700" fill="#333" text-anchor="start">snap it back</text>
<text x="300" y="966" font-size="13" font-weight="400" fill="#333" text-anchor="start">XIAO reboots, recalibrates, sound returns</text>
<text x="300" y="982" font-size="12" font-weight="400" fill="#0f766e" text-anchor="start">link: up</text>
<rect x="820" y="750" width="740" height="260" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
<text x="840" y="782" font-size="16" font-weight="700" fill="#222" text-anchor="start">Order of operations</text>
<text x="840" y="812" font-size="13" font-weight="400" fill="#333" text-anchor="start">1. XIAO on USB alone: upload 03_hall_id_test, check the IDs in its monitor.</text>
<text x="840" y="836" font-size="13" font-weight="400" fill="#333" text-anchor="start">2. Unplug the XIAO USB. Teensy on USB: upload 04_core_hall_link.</text>
<text x="840" y="860" font-size="13" font-weight="400" fill="#333" text-anchor="start">3. Wire VIN / GND to the female pogo, male pogo to XIAO 5V / GND,</text>
<text x="840" y="884" font-size="13" font-weight="400" fill="#333" text-anchor="start">    and the D6 → pin 0 jumper. Keep magnets away while it powers up</text>
<text x="840" y="908" font-size="13" font-weight="400" fill="#333" text-anchor="start">    (it calibrates for ~0.3 s at boot).</text>
<text x="840" y="932" font-size="13" font-weight="400" fill="#333" text-anchor="start">4. Snap the pogo pair: "link: up" on the Teensy monitor.</text>
<text x="840" y="956" font-size="13" font-weight="400" fill="#333" text-anchor="start">5. Switch on, place and lift the card, then pull the pogo pair.</text>
<text x="840" y="980" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start">Never power the XIAO from USB and the pogo pair at the same time.</text>
</svg>